services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: testPierre
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: test
    ports: 
     - "5433:5432"


  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules